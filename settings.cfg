#
# DO NOT EDIT THIS FILE!
# INSTEAD, CREATE A NEW FILE `settings.cfg` UNDER `%LocalAppData%\Quad-Views-Foveated`
# DO NOT COPY THIS FILE, START FROM A BLANK FILE!
#

# Common settings for all headsets (unless overriden below).
smoothen_focus_view_edges=0.2
sharpen_focus_view=0
# Bias the peripheral sampler toward lower (softer) mips to reduce EASU
# upscaling shimmer. 0.25 is a mild bias that softens shimmer without the
# noticeable darkening that higher values (0.5+) caused on high-contrast content.
peripheral_lod_bias=0.25

# Radial peripheral LOD bias: sharpens the focus center by reducing mip bias
# near the gaze point while keeping the periphery at the configured bias.
# 0.0 = disabled (uniform bias only). Default 0.3 is subtle — slight center
# sharpening without noticeable edge darkening.
radial_lod_max_boost=0.3
# radial_lod_start=0.2    # distance from center where bias starts ramping
# radial_lod_end=0.6      # distance where bias reaches max
# focus_aspect=1.0        # aspect correction for non-square focus regions
# Turbo mode is an unsafe feature that should not be enabled by default.
turbo_mode=0

# Log level: Verbose, Debug, Information, Warning, Error, Fatal
# Default: Information (hides Verbose and Debug messages)
# log_level=Information

# Blink freeze: when eye tracking is lost during a blink, hold the last valid
# focus-view FOV instead of falling back to cached gaze. This eliminates the
# post-blink blur caused by the transition from pre-blink to post-blink gaze.
# blink_freeze_focus_region=1
# blink_freeze_grace_ms=150   # how long to hold frozen FOV after recovery if gaze jumped far

# Anti-cheat games (EAC/BattlEye/EQU8) may flag this layer as an "untrusted
# system file". There is no in-layer fix; disable the layer for such games by
# setting DISABLE_XR_APILAYER_MBUCCHIA_quad_views_foveated=1 when launching

# Fixed Foveated rendering settings for fallback when eye tracker is not available.
horizontal_fixed_section=0.5
vertical_fixed_section=0.45

[Oculus]
peripheral_multiplier=0.4
focus_multiplier=1.1
horizontal_focus_section=0.5
vertical_focus_section=0.5

[Varjo]
horizontal_focus_section=0.29
vertical_focus_section=0.33
# Turbo mode is incompatible with Varjo's deferred swapchain release. Use OpenXR Toolkit Turbo instead.
turbo_mode=0

[PimaxXR]
# Dynamic Foveated Rendering settings (for Crystal)
horizontal_focus_section=0.33
vertical_focus_section=0.31

[Windows Mixed Reality]
peripheral_multiplier=0.4
focus_multiplier=1.1
# Dynamic Foveated Rendering settings (for G2 Omnicept Edition)
horizontal_focus_section=0.3
vertical_focus_section=0.3
vertical_focus_offset=0.04

[SteamVR]
# Turbo Mode causes unexplained errors with SteamVR.
turbo_mode=0


# Un-advertise in incompatible apps.
[exe:Contractors]
unadvertise=1
[app:WanderingSpace]
unadvertise=1
